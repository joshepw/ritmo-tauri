<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Gemini</title>
<style>
body{margin:0;height:100vh;background:#0c0c0c;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
#app{height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;flex:none}
header img{width:18px;height:18px}
header span{font-size:15px;font-weight:600;flex:1}
button{width:24px;height:24px;border:0;border-radius:50%;background:transparent;color:rgba(235,235,245,.6);font-size:13px;cursor:default}
button:hover{background:rgba(255,255,255,.1)}
#scroll{flex:1;overflow-y:auto;padding:0 16px 14px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(235,235,245,.6)}
.spin{width:14px;height:14px;border-radius:50%;border:1.6px solid rgba(255,255,255,.2);border-top-color:#f5f5f7;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
#summary{font-size:14px;line-height:1.5;white-space:pre-wrap}
h2{margin:0;font-size:11px;font-weight:600;color:rgba(235,235,245,.5)}
.sug{display:flex;align-items:center;gap:10px;padding:8px 4px;border-radius:10px;cursor:default}
.sug:hover{background:#151515}
.icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.sug div{flex:1;min-width:0}
.sug b{display:block;font-weight:500;font-size:13px}
.sug small{color:rgba(235,235,245,.55);font-size:11.5px}
.cta{color:#0a84ff;font-size:12px;font-weight:500}
.bubble{font-size:13px;line-height:1.45;white-space:pre-wrap}
.mine{align-self:flex-end;max-width:85%;background:#0a84ff;color:#fff;padding:7px 12px;border-radius:16px}
footer{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;flex:none}
form{display:flex;align-items:center;gap:8px;background:#151515;border:.5px solid rgba(255,255,255,.08);border-radius:20px;padding:7px 8px 7px 14px}
input{flex:1;background:transparent;border:0;outline:0;color:#f5f5f7;font-size:13px;font-family:inherit}
.send{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-weight:700}
.send.ready{background:#0a84ff}
.note{text-align:center;font-size:10.5px;color:rgba(235,235,245,.4)}
</style>
</head>
<body>
<div id="app">
  <header>
    <img src="assets/gemini.svg" alt="">
    <span>Gemini</span>
    <button id="refresh" title="Actualizar" type="button">↻</button>
    <button id="close" title="Cerrar" type="button">✕</button>
  </header>
  <div id="scroll">
    <div id="status" class="row" hidden><div class="spin"></div><span id="statusText">Revisando tu día…</span></div>
    <div id="summary"></div>
    <div>
      <h2>Sugerencias</h2>
      <div id="actions"></div>
    </div>
    <div id="thread" style="display:flex;flex-direction:column;gap:8px"></div>
  </div>
  <footer>
    <form id="ask">
      <input id="draft" placeholder="Pregunta a Gemini" autocomplete="off">
      <button class="send" id="send" type="submit">↑</button>
    </form>
    <div class="note">Incluido en Google Workspace para tu equipo</div>
  </footer>
</div>
<script>
const tauri = window.__TAURI__;
const invoke = (command, args) => tauri.core.invoke(command, args || {});
const summary = document.getElementById('summary');
const status = document.getElementById('status');
const statusText = document.getElementById('statusText');
const actions = document.getElementById('actions');
const thread = document.getElementById('thread');
const draft = document.getElementById('draft');
const send = document.getElementById('send');
let asking = false;

function setBusy(text) {
  status.hidden = !text;
  if (text) statusText.textContent = text;
}

async function loadSummary() {
  setBusy('Revisando tu día…');
  try {
    const result = await invoke('assistant_summary', { manual: true });
    summary.textContent = result.text || '';
  } catch (error) {
    summary.textContent = String(error && error.message || error || 'No se pudo preparar el resumen.');
  }
  setBusy('');
}

async function loadSuggestions() {
  actions.replaceChildren();
  try {
    const snap = await invoke('snapshot');
    for (const item of snap.suggestions || []) {
      const row = document.createElement('div');
      row.className = 'sug';
      row.innerHTML = '<div class="icon"></div><div><b></b><small></small></div><span class="cta"></span>';
      row.querySelector('.icon').textContent = item.icon || '·';
      row.querySelector('.icon').style.background = item.bg || 'rgba(255,255,255,.08)';
      row.querySelector('.icon').style.color = item.color || '#f5f5f7';
      row.querySelector('b').textContent = item.title || '';
      row.querySelector('small').textContent = item.whenLabel || '';
      row.querySelector('.cta').textContent = item.cta || '';
      row.addEventListener('click', () => runSuggestion(item));
      actions.appendChild(row);
    }
  } catch (error) {
    actions.textContent = '';
  }
}

async function runSuggestion(item) {
  if (item.action === 'open-notes') {
    await tauri.event.emit('ritmo-surface', 'open-notes');
    return;
  }
  await invoke('pomodoro_action', { action: 'start', taskId: item.targetId || null });
}

function addBubble(text, mine) {
  const node = document.createElement('div');
  node.className = mine ? 'bubble mine' : 'bubble';
  node.textContent = text;
  thread.appendChild(node);
  thread.parentElement.scrollTop = thread.parentElement.scrollHeight;
}

draft.addEventListener('input', () => {
  send.classList.toggle('ready', draft.value.trim().length > 0);
});

document.getElementById('ask').addEventListener('submit', async (event) => {
  event.preventDefault();
  const question = draft.value.trim();
  if (!question || asking) return;
  asking = true;
  draft.value = '';
  send.classList.remove('ready');
  addBubble(question, true);
  setBusy('Pensando…');
  try {
    const result = await invoke('assistant_ask', { question });
    addBubble(result.text || '', false);
  } catch (error) {
    addBubble(String(error && error.message || error || 'No se pudo preguntar.'), false);
  }
  asking = false;
  setBusy('');
});

document.getElementById('refresh').addEventListener('click', () => { loadSummary(); loadSuggestions(); });
document.getElementById('close').addEventListener('click', () => invoke('hide_gemini_window'));

loadSummary();
loadSuggestions();
</script>
</body>
</html>
