[package]
name = "ritmo"
version = "0.1.0"
description = "Ritmo: tu día, tus reuniones y tu enfoque en la barra de menú"
edition = "2021"

[lib]
name = "ritmo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "unstable"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
keyring = "3"
open = "5"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["time", "sync"] }
urlencoding = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
mac-usernotifications = "0.3"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSUserDefaults", "NSNotification", "NSDistributedNotificationCenter"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSRunningApplication", "NSWindow", "NSView", "NSAppearance", "NSColor", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["CALayer"] }
